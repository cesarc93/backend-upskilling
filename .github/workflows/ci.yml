name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest # Docker is preinstalled, so Testcontainers works
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build, test and coverage
        run: mvn -B -ntp verify